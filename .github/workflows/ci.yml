name: CI • Build • Test • Sonar • Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write        # para GHCR
  actions: read
  security-events: write # se for usar code scanning
  id-token: write        # necessário para alguns uploads
  pull-requests: write

jobs:
  build-test-sonar-docker:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      # Caminho onde salvaremos cobertura para o Sonar
      COVERAGE_FILE: ./TestResults/coverage.opencover.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Test (with Coverage)
        run: |
          mkdir -p TestResults
          dotnet test --no-build -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.opencover.xml

      # -------- Sonar (SonarCloud) --------
      # Requer secrets: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORG
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN && secrets.SONAR_PROJECT_KEY && secrets.SONAR_ORG }}
        uses: SonarSource/sonarcloud-github-action@v2.1.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.cs.opencover.reportsPaths=${{ env.COVERAGE_FILE }}
            -Dsonar.junit.reportPaths=**/TestResults/*.trx
            -Dsonar.log.level=INFO

      # -------- Sonar (SonarQube self-hosted) --------
      # Alternativa: use os secrets SONAR_HOST_URL e SONAR_TOKEN
      - name: SonarQube Scan (self-hosted)
        if: ${{ secrets.SONAR_HOST_URL && secrets.SONAR_TOKEN && !secrets.SONAR_PROJECT_KEY }}
        uses: sonarsource/sonarqube-scan-action@v2.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Castri.Finance
            -Dsonar.cs.opencover.reportsPaths=${{ env.COVERAGE_FILE }}
            -Dsonar.junit.reportPaths=**/TestResults/*.trx
            -Dsonar.log.level=INFO

      - name: Upload Test Results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: |
            **/TestResults/*.trx
            **/TestResults/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Coverage (OpenCover)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: ${{ env.COVERAGE_FILE }}
          if-no-files-found: ignore
          retention-days: 7

      # -------- Docker Build & Push (GHCR) --------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: deploy/Dockerfile # ajuste se necessário
